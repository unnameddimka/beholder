<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>Beholder</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back-button" class="icon-button hidden" type="button" aria-label="Back">&#8592;</button>
    <a id="home-link" class="brand" href="#/">Beholder</a>
    <span id="page-title" class="page-title"></span>
    <span id="activity" class="activity" title="System activity">
      <span class="dot" aria-hidden="true"></span><span id="activity-label">Idle</span>
    </span>
    <a id="dump-link" class="dump-button" href="/api/dump" download title="Download an Emergency Dump (sanitized ZIP)">Dump</a>
  </header>
  <div id="error-banner" class="error-banner hidden" role="alert"></div>
  <main id="view" class="view"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
